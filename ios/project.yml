name: Boji
options:
  bundleIdPrefix: club.leanmuscle
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
  xcodeVersion: '27.1'
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '7'
    DEVELOPMENT_TEAM: 8U3ZJ258K9
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # The compiler writes the localizable literals to .stringsdata, so Xcode can sync Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    BOJI_API_BASE_URL: ''
    BOJI_APPLE_SIGN_IN_ENABLED: 'YES'
    # Empty keeps Sentry crash reporting off. Set it per build, for example with xcodebuild BOJI_SENTRY_DSN=...
    BOJI_SENTRY_DSN: ''
    BOJI_WALLET_PASS_TYPE_IDENTIFIER: pass.club.leanmuscle.boji.membership
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    exactVersion: 4.6.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.30.2
  BojiAPI:
    path: BojiAPI
targets:
  Boji:
    type: application
    platform: iOS
    sources:
      - path: Boji
        excludes:
          - '**/*.tmp'
          - '**/.manus-*.tmp'
          # XcodeGen 2.46.0 emits a random TEMP_ ID for an empty DebugSupport group.
          # Debug fixtures stay on disk and the Debug-only pre-build script copies them.
          - 'DebugSupport/**'
      - path: Shared
      - path: ../animations/lottie
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Copy Debug animation fixtures
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            destination="${BOJI_ANIMATION_FIXTURE_DIR}"
            /bin/mkdir -p "$destination"
            /bin/cp "${SRCROOT}/Boji/DebugSupport/Fixtures/"*.json "$destination/"
          fi
        inputFiles:
          - ${SRCROOT}/Boji/DebugSupport/Fixtures/index.json
          - ${SRCROOT}/Boji/DebugSupport/Fixtures/light.json
          - ${SRCROOT}/Boji/DebugSupport/Fixtures/dark.json
        outputFiles:
          - ${BOJI_ANIMATION_FIXTURE_DIR}/index.json
          - ${BOJI_ANIMATION_FIXTURE_DIR}/light.json
          - ${BOJI_ANIMATION_FIXTURE_DIR}/dark.json
    dependencies:
      - target: BojiWidgets
        embed: true
      - target: BojiWatch
        embed: true
      - package: Lottie
      - package: Sentry
        product: Sentry
      - package: BojiAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.leanmuscle.boji
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Boji/Info.plist
        CODE_SIGN_ENTITLEMENTS: Boji/Boji.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 薄肌
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
        # Xcode creates output parents even when the script does not copy files.
        BOJI_ANIMATION_FIXTURE_DIR: $(DERIVED_FILE_DIR)/RemoteAnimationFixtures
      configs:
        Debug:
          BOJI_ANIMATION_FIXTURE_DIR: $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/RemoteAnimationFixtures
  BojiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BojiWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.leanmuscle.boji.widgets
        INFOPLIST_FILE: BojiWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: BojiWidgets/BojiWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  BojiWatch:
    type: application
    platform: watchOS
    sources:
      - path: BojiWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.leanmuscle.boji.watchkitapp
        INFOPLIST_FILE: BojiWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: BojiWatch/BojiWatch.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '4'
  BojiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BojiTests
    dependencies:
      - target: Boji
  BojiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BojiUITests
    dependencies:
      - target: Boji
schemes:
  Boji:
    build:
      targets:
        Boji: all
        BojiTests: [test]
        BojiUITests: [test]
    test:
      # The tests assert Simplified Chinese copy. English is the fallback language, so
      # a simulator in another language would show English without these settings.
      language: zh-Hans
      region: CN
      targets:
        - BojiTests
        - BojiUITests
  BojiWatch:
    build:
      targets:
        BojiWatch: all
