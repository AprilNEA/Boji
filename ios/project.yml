name: Boji
options:
  bundleIdPrefix: club.leanmuscle
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '3'
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    BOJI_API_BASE_URL: ''
    BOJI_APPLE_SIGN_IN_ENABLED: 'NO'
    BOJI_WALLET_PASS_TYPE_IDENTIFIER: ''
targets:
  Boji:
    type: application
    platform: iOS
    sources:
      - path: Boji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aprilnea.boji
        INFOPLIST_FILE: Boji/Info.plist
        CODE_SIGN_ENTITLEMENTS: Boji/Boji.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 薄肌
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
  BojiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BojiTests
    dependencies:
      - target: Boji
  BojiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BojiUITests
    dependencies:
      - target: Boji
schemes:
  Boji:
    build:
      targets:
        Boji: all
        BojiTests: [test]
        BojiUITests: [test]
    test:
      targets:
        - BojiTests
        - BojiUITests
