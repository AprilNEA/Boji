[package]
name = "boji-bizserver"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
better-auth = { version = "=1.0.0-alpha.4", default-features = false, features = ["axum", "seaorm2", "rustls"] }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
connectrpc = { version = "0.9", features = ["axum"] }
dotenvy = "0.15"
hex = "0.4"
http = "1"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "pem", "pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
