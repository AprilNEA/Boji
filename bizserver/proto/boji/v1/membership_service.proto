syntax = "proto3";

package boji.v1;

import "boji/v1/membership.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option java_multiple_files = true;
option java_outer_classname = "MembershipServiceProto";
option java_package = "club.leanmuscle.boji.v1";

// Serves the membership card to its holder.
//
// Every method requires a signed Bearer session for a verified email address.
// The `{user}` segment of a resource name must be `me` or the user ID of the
// caller. Responses always use the canonical user ID. Another user ID returns
// `PERMISSION_DENIED` with the reason `RESOURCE_ACCESS_DENIED`. Every method
// returns the full view of `Membership`.
service MembershipService {
  option (google.api.default_host) = "boji.leanmuscle.club";

  // Returns one membership card of the caller.
  //
  // Errors: `NOT_FOUND` `MEMBERSHIP_NOT_FOUND` when the user has no card with
  // this ID.
  rpc GetMembership(GetMembershipRequest) returns (Membership) {
    option (google.api.http) = {get: "/v1/{name=users/*/memberships/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the membership cards of the caller. The response contains no card
  // before enrollment and one card after enrollment.
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse) {
    option (google.api.http) = {get: "/v1/{parent=users/*}/memberships"};
    option (google.api.method_signature) = "parent";
  }

  // Enrolls the caller and issues a membership card with the community
  // entitlements.
  //
  // Errors:
  // - `INVALID_ARGUMENT` `INVALID_INPUT`: `nickname` is invalid.
  // - `FAILED_PRECONDITION` `TERMS_NOT_ACCEPTED`: `terms_version` is not the
  //   current version.
  // - `ALREADY_EXISTS` `MEMBERSHIP_ALREADY_EXISTS`: the user already has a
  //   card. Call `ListMemberships` to read it. A retry after a lost response
  //   therefore returns this error.
  rpc CreateMembership(CreateMembershipRequest) returns (Membership) {
    option (google.api.http) = {
      post: "/v1/{parent=users/*}/memberships"
      body: "membership"
    };
    option (google.api.method_signature) = "parent,membership";
  }
}

// Request message for `MembershipService.GetMembership`.
message GetMembershipRequest {
  // Required. The name of the card, for example `users/me/memberships/m1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Membership"
  ];
}

// Request message for `MembershipService.ListMemberships`.
message ListMembershipsRequest {
  // Required. The user, for example `users/me`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "boji.leanmuscle.club/Membership"
  ];

  // Optional. The maximum number of cards to return. Zero means the default
  // of 50. Values above 100 are treated as 100. Negative values return
  // `INVALID_ARGUMENT`.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The `next_page_token` of a previous call with the same
  // `parent`. Empty for the first page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `MembershipService.ListMemberships`.
message ListMembershipsResponse {
  // The cards of the caller. A user holds at most one card.
  repeated Membership memberships = 1;

  // A token for the next page. Empty when no further page exists.
  string next_page_token = 2;
}

// Request message for `MembershipService.CreateMembership`.
//
// (-- api-linter: core::0133::request-id-field=disabled
//     aip.dev/not-precedent: The server assigns the membership ID, because a
//     user holds at most one card. --)
message CreateMembershipRequest {
  // Required. The user who enrolls, for example `users/me`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "boji.leanmuscle.club/Membership"
  ];

  // Required. The card to create. Set `nickname` and `terms_version`. The
  // server ignores `name` and every output-only field.
  Membership membership = 2 [(google.api.field_behavior) = REQUIRED];
}
