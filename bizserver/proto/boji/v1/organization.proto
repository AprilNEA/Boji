syntax = "proto3";

package boji.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/localized_text.proto";

option java_multiple_files = true;
option java_outer_classname = "OrganizationProto";
option java_package = "club.leanmuscle.boji.v1";

// An organization that members can verify their affiliation with, for
// example a school.
//
// Users cannot add an organization or edit its names or domains. The server
// imports each organization list from files in the server repository.
message Organization {
  option (google.api.resource) = {
    type: "boji.leanmuscle.club/Organization"
    pattern: "organizations/{organization}"
    singular: "organization"
    plural: "organizations"
  };

  // Identifier. The resource name, for example
  // `organizations/0b6f3a8e-6f0c-4a3b-9f3e-2d1c0b9a8f7e`. The ID is a UUID
  // that stays stable when the organization list is imported again.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The type of the organization.
  OrganizationType type = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The names of the organization. The first entry is always
  // the English name from the organization list with the language code `en`,
  // for example `Xi'an Jiaotong-Liverpool University`. When the list has a
  // Chinese name, the next entry has the language code `zh-Hans`, for
  // example `西交利物浦大学`. Show the entry of the user's language, and the
  // English entry when no entry matches.
  repeated google.type.LocalizedText display_names = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The CLDR region code of the country or region, for example
  // `CN`, `HK` or `GB`.
  string region_code = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The email domains that affiliation verification accepts, in
  // lexical order. An address at a subdomain also matches, unless a longer
  // listed domain belongs to another organization of the same type. For
  // example, `uq.edu.au` also accepts `student.uq.edu.au`.
  repeated string email_domains = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The public ranking information of one organization.
//
// A member counts toward an organization when the member holds an active
// membership card, is not banned, and holds an unexpired affiliation with the
// organization. The ranking of a type orders its organizations by member
// count, from most to fewest. For equal counts, the organization that reached
// its current count earlier comes first. The response never contains that
// time, because it is the verification time of one member.
//
// Operators can freeze an organization while they review unusual growth.
// While the organization is frozen, the ranking uses the counts at freeze
// time for the position and for `member_count` and
// `weekly_new_member_count`, and `frozen` is true.
message OrganizationStanding {
  option (google.api.resource) = {
    type: "boji.leanmuscle.club/OrganizationStanding"
    pattern: "organizations/{organization}/standing"
    singular: "organizationStanding"
    plural: "organizationStandings"
  };

  // Whether the ranking shows the organization. New values can be added. A
  // client that receives an unknown value must treat the organization as not
  // ranked.
  enum Placement {
    // Never sent.
    PLACEMENT_UNSPECIFIED = 0;
    // The organization has at least the public threshold of counted members
    // and appears in the ranking. `rank`, `member_count` and
    // `weekly_new_member_count` are set.
    RANKED = 1;
    // The organization has counted members, but fewer than the public
    // threshold of its type. The threshold of `SCHOOL` is 3. The counts stay
    // hidden, so that the numbers cannot identify a member.
    BELOW_THRESHOLD = 2;
    // The organization has no counted member.
    NO_MEMBERS = 3;
  }

  // Identifier. The resource name, for example
  // `organizations/0b6f3a8e-6f0c-4a3b-9f3e-2d1c0b9a8f7e/standing`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Whether the ranking shows the organization.
  Placement placement = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The 1-based position in the ranking of the organization type
  // when `placement` is `RANKED`. Positions are consecutive and never shared.
  // Zero otherwise.
  int32 rank = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The number of counted members when `placement` is `RANKED`.
  // Zero otherwise.
  int32 member_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The number of counted members whose counting started in the
  // current week, when `placement` is `RANKED`. Zero otherwise. A renewal
  // does not restart counting.
  int32 weekly_new_member_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The start of the current week: Monday 00:00 in China
  // Standard Time (UTC+8).
  google.protobuf.Timestamp week_start_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the server computed the ranking. The server caches the
  // ranking for up to 60 seconds.
  google.protobuf.Timestamp compute_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A copy of `Organization.display_names`, so that a ranking
  // page needs no further call.
  repeated google.type.LocalizedText organization_display_names = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A copy of `Organization.region_code`.
  string organization_region_code = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether operators froze the counts of the organization for
  // review. A ranking page shows the organization as under review. The
  // counts of a frozen organization below the public threshold stay hidden.
  bool frozen = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A copy of `Organization.type`. The ranking of this type
  // contains the organization.
  OrganizationType organization_type = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The type of an organization. New values can be added. A client that
// receives an unknown value must hide the organization.
//
// Each type has its own organization list, its own verification rules and its
// own ranking. Organizations of different types never share a ranking.
enum OrganizationType {
  // Never sent. A request that needs a type and sends this value returns
  // `INVALID_ARGUMENT`.
  ORGANIZATION_TYPE_UNSPECIFIED = 0;

  // A university or college. The organization list of this type contains
  // only schools of the Hipo university-domains-list snapshot in the server
  // repository, with local corrections. In resource names, the type is
  // written as `school`.
  SCHOOL = 1;
}
