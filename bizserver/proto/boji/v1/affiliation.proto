syntax = "proto3";

package boji.v1;

import "boji/v1/organization.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "AffiliationProto";
option java_package = "club.leanmuscle.boji.v1";

// The affiliation of one user with one organization of a type.
//
// Every user has one affiliation for each organization type. The ID of the
// affiliation is the type in lowercase, for example `school`. A user who
// never verified an organization of the type, or who left it, has the state
// `UNAFFILIATED`. A user can hold one organization per type.
//
// The server never stores the email address of a verification. It stores a
// keyed hash of the address, so that one address counts for one account
// only, and the domain of the address.
message Affiliation {
  option (google.api.resource) = {
    type: "boji.leanmuscle.club/Affiliation"
    pattern: "users/{user}/affiliations/{affiliation}"
    singular: "affiliation"
    plural: "affiliations"
  };

  // The state of the affiliation. New states can be added. A client that
  // receives an unknown state must treat the user as not counted.
  enum State {
    // Never sent.
    STATE_UNSPECIFIED = 0;
    // The user has no organization of this type. Only
    // `organization_change_available_time` can be set: after the user leaves
    // an organization, a verification for another organization can succeed
    // only from that time.
    UNAFFILIATED = 1;
    // The affiliation is valid until `expire_time`.
    ACTIVE = 2;
    // The affiliation expired. Verify again to count again. Counting then
    // starts again.
    EXPIRED = 3;
  }

  // Identifier. The resource name, for example
  // `users/me/affiliations/school` in a request and
  // `users/{user}/affiliations/school` in a response.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The organization type of this affiliation. The ID of the
  // resource name is the same type in lowercase.
  OrganizationType organization_type = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The state of the affiliation.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The organization, for example
  // `organizations/{organization}`.
  string organization = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Organization"
  ];

  // Output only. The domain of the verified address, for example
  // `student.xjtlu.edu.cn`.
  string email_domain = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. True when the user counts toward the organization now: the
  // state is `ACTIVE`, the membership card is active and the account is not
  // banned.
  bool counted = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last successful verification.
  google.protobuf.Timestamp verify_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The start of the current continuous counting. A renewal
  // before `expire_time` keeps this time.
  google.protobuf.Timestamp count_start_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the affiliation expires. A `SCHOOL` affiliation is
  // valid for 365 days after each verification.
  google.protobuf.Timestamp expire_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The earliest time when a verification for another
  // organization of the type can succeed. Empty when it can succeed now. The
  // server allows one `SCHOOL` change per 30 days. A verification for the
  // same organization can succeed at any time.
  google.protobuf.Timestamp organization_change_available_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One code sent to an email address for an affiliation.
//
// Creating a verification sends a 6-digit code to the address. Confirming
// the verification with the code creates, renews or changes the affiliation
// that is the parent. A verification expires after 10 minutes or after 5
// wrong codes, and it can be confirmed only once.
message AffiliationEmailVerification {
  option (google.api.resource) = {
    type: "boji.leanmuscle.club/AffiliationEmailVerification"
    pattern: "users/{user}/affiliations/{affiliation}/emailVerifications/{email_verification}"
    singular: "affiliationEmailVerification"
    plural: "affiliationEmailVerifications"
  };

  // Identifier. The resource name, for example
  // `users/{user}/affiliations/school/emailVerifications/{email_verification}`.
  // The ID is a UUID that the server assigns.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. Input only. The email address at the organization. The server
  // uses it only to send the code and never returns or stores it.
  string email = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Output only. The address with most of its local part hidden, for example
  // `a***@student.xjtlu.edu.cn`.
  string masked_email = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The organizations of the parent type that the domain of the
  // address matches, for example `organizations/{organization}`. Usually one
  // organization. When it lists more than one, the user must choose one in
  // `ConfirmAffiliationEmailVerificationRequest.organization`.
  repeated string candidate_organizations = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Organization"
  ];

  // Output only. When the server sent the code.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the code expires.
  google.protobuf.Timestamp expire_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The earliest time when the user can request another code.
  google.protobuf.Timestamp resend_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}
