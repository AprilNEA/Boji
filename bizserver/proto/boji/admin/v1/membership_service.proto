syntax = "proto3";

package boji.admin.v1;

import "boji/v1/membership.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "MembershipServiceProto";
option java_package = "club.leanmuscle.boji.admin.v1";

// Lets operators read every membership card, suspend and resume cards, and
// grant and revoke entitlements.
//
// The authorization rules and errors of `EntitlementService` apply to every
// method. The method comments name the required permissions.
//
// Resource names can use `-` as the `{user}` segment to read a card by its
// ID alone (AIP-159). Responses always use the canonical user ID. A name whose
// user does not own the card returns `NOT_FOUND`.
//
// Every state change appends one audit event in the same database
// transaction. The event stores the actor, the target user, the action, the
// reason and the affected IDs. Its structured metadata omits email addresses,
// health data, tokens and credentials. Operators must keep those out of the
// free-text reason as well.
//
// Every state-changing request requires `reason`. The server removes leading
// and trailing white space. The result must contain 1 to 500 Unicode scalar
// values and no control characters.
service MembershipService {
  option (google.api.default_host) = "boji.leanmuscle.club";

  // Returns one card. Permission: `membership.read`. The full view also
  // requires `entitlement.read`.
  //
  // Errors: `NOT_FOUND` `MEMBERSHIP_NOT_FOUND`.
  rpc GetMembership(GetMembershipRequest) returns (boji.v1.Membership) {
    option (google.api.http) = {get: "/v1/{name=users/*/memberships/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists cards ordered by `create_time` descending, then by the
  // `{membership}` segment descending. Permission: `membership.read`. The
  // full view also requires `entitlement.read`.
  //
  // A card created during pagination never shifts later pages. A card whose
  // state changes during pagination can enter or leave a filtered list.
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse) {
    option (google.api.http) = {get: "/v1/{parent=users/*}/memberships"};
    option (google.api.method_signature) = "parent";
  }

  // Suspends an active card. Permission: `membership.update`.
  //
  // A suspended card stays visible to its holder and exposes no effective
  // entitlements. `WalletService` issues no new pass for it. Suspension does
  // not revoke grants, sessions, synchronized activities or local data.
  //
  // Errors:
  // - `NOT_FOUND` `MEMBERSHIP_NOT_FOUND`.
  // - `FAILED_PRECONDITION` `MEMBERSHIP_ALREADY_SUSPENDED`: the call changed
  //   nothing and wrote no audit event.
  rpc SuspendMembership(SuspendMembershipRequest) returns (boji.v1.Membership) {
    option (google.api.http) = {
      post: "/v1/{name=users/*/memberships/*}:suspend"
      body: "*"
    };
  }

  // Resumes a suspended card. Permission: `membership.update`.
  //
  // Grants that are unrevoked, started and unexpired become effective again.
  // Resumption does not restore revoked or expired grants.
  //
  // Errors:
  // - `NOT_FOUND` `MEMBERSHIP_NOT_FOUND`.
  // - `FAILED_PRECONDITION` `MEMBERSHIP_ALREADY_ACTIVE`: the call changed
  //   nothing and wrote no audit event.
  rpc ResumeMembership(ResumeMembershipRequest) returns (boji.v1.Membership) {
    option (google.api.http) = {
      post: "/v1/{name=users/*/memberships/*}:resume"
      body: "*"
    };
  }

  // Returns one grant. Permissions: `membership.read` and
  // `entitlement.read`.
  //
  // Errors: `NOT_FOUND` `MEMBERSHIP_NOT_FOUND` or
  // `ENTITLEMENT_GRANT_NOT_FOUND`.
  rpc GetEntitlementGrant(GetEntitlementGrantRequest) returns (EntitlementGrant) {
    option (google.api.http) = {get: "/v1/{name=users/*/memberships/*/entitlementGrants/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists every stored grant of one card, including revoked and expired
  // grants, ordered by the code of the catalog entry ascending.
  // Permissions: `membership.read` and `entitlement.read`.
  //
  // Errors: `NOT_FOUND` `MEMBERSHIP_NOT_FOUND`.
  rpc ListEntitlementGrants(ListEntitlementGrantsRequest) returns (ListEntitlementGrantsResponse) {
    option (google.api.http) = {get: "/v1/{parent=users/*/memberships/*}/entitlementGrants"};
    option (google.api.method_signature) = "parent";
  }

  // Creates, restores or updates the grant of one catalog entry to one card.
  // Permission: `entitlement.grant`.
  //
  // After the call, the grant is unrevoked and has the requested expiry:
  // - No grant, or a revoked grant: the server sets `grant_time` to the
  //   server time and clears `revoke_time`.
  // - An unrevoked grant: the server keeps `grant_time` and replaces
  //   `expire_time`. An absent `expire_time` therefore clears an existing
  //   expiry.
  // - An unrevoked grant with the requested expiry: the call returns the
  //   grant, changes nothing and writes no audit event.
  //
  // A grant on a suspended card is stored, and it becomes effective after
  // `ResumeMembership`.
  //
  // Errors:
  // - `NOT_FOUND` `MEMBERSHIP_NOT_FOUND` or `ENTITLEMENT_NOT_FOUND`.
  // - `FAILED_PRECONDITION` `ENTITLEMENT_INACTIVE`.
  rpc GrantEntitlement(GrantEntitlementRequest) returns (GrantEntitlementResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=users/*/memberships/*}/entitlementGrants:grant"
      body: "*"
    };
  }

  // Revokes one grant. The server sets `revoke_time` to the server time and
  // keeps `grant_time` and `expire_time`. Revocation works on inactive
  // catalog entries. Permission: `entitlement.revoke`.
  //
  // Errors:
  // - `NOT_FOUND` `MEMBERSHIP_NOT_FOUND`, `ENTITLEMENT_NOT_FOUND` or
  //   `ENTITLEMENT_GRANT_NOT_FOUND`.
  // - `FAILED_PRECONDITION` `ENTITLEMENT_GRANT_ALREADY_REVOKED`: the call
  //   changed nothing and wrote no audit event.
  rpc RevokeEntitlementGrant(RevokeEntitlementGrantRequest) returns (EntitlementGrant) {
    option (google.api.http) = {
      post: "/v1/{name=users/*/memberships/*/entitlementGrants/*}:revoke"
      body: "*"
    };
  }
}

// One stored grant of a catalog entry to a membership card. A card holds at
// most one grant per catalog entry, so the `{entitlement_grant}` segment
// equals the `{entitlement}` segment of the catalog entry.
message EntitlementGrant {
  option (google.api.resource) = {
    type: "boji.leanmuscle.club/EntitlementGrant"
    pattern: "users/{user}/memberships/{membership}/entitlementGrants/{entitlement_grant}"
    singular: "entitlementGrant"
    plural: "entitlementGrants"
  };

  // Identifier. The resource name, for example
  // `users/u1/memberships/m1/entitlementGrants/e1`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The catalog entry, for example `entitlements/e1`.
  string entitlement = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Entitlement"
  ];

  // Output only. The time when the grant started.
  google.protobuf.Timestamp grant_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the grant expires. Absent when the grant has
  // no expiry.
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the grant was revoked. Absent while the grant
  // is unrevoked.
  google.protobuf.Timestamp revoke_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. True when the card exposes this grant now: the card and the
  // catalog entry are active, the grant has started, and the grant is
  // neither revoked nor expired.
  bool effective = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for `MembershipService.GetMembership`.
message GetMembershipRequest {
  // Required. The name of the card, for example `users/-/memberships/m1`.
  //
  // (-- api-linter: core::0124::reference-same-package=disabled
  //     aip.dev/not-precedent: The owner API and the operations API share the
  //     Membership resource. --)
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Membership"
  ];

  // Optional. The fields to return. The default is the full view.
  MembershipView view = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for `MembershipService.ListMemberships`.
message ListMembershipsRequest {
  // Required. The user, for example `users/u1`, or `users/-` for every user.
  //
  // (-- api-linter: core::0124::reference-same-package=disabled
  //     aip.dev/not-precedent: The owner API and the operations API share the
  //     Membership resource. --)
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "boji.leanmuscle.club/Membership"
  ];

  // Optional. The maximum number of cards to return. Zero means the default
  // of 50. Values above 100 are treated as 100. Negative values return
  // `INVALID_ARGUMENT`.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The `next_page_token` of a previous call with the same
  // `parent`, `filter` and `view`. Empty for the first page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A subset of AIP-160: one or two comparisons joined by `AND`.
  // Each comparison uses `=` and one of these fields:
  // - `state`: `ACTIVE` or `SUSPENDED`, for example `state = SUSPENDED`.
  // - `member_number`: a quoted string that must match exactly, for example
  //   `member_number = "<member number>"`. The server applies no
  //   normalization.
  // Other expressions return `INVALID_ARGUMENT` `INVALID_FILTER`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The fields to return. The default is the basic view.
  MembershipView view = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `MembershipService.ListMemberships`.
message ListMembershipsResponse {
  // The cards on this page.
  //
  // (-- api-linter: core::0215::foreign-type-reference=disabled
  //     aip.dev/not-precedent: The owner API and the operations API share the
  //     Membership resource. --)
  repeated boji.v1.Membership memberships = 1;

  // A token for the next page. Empty when no further page exists.
  string next_page_token = 2;
}

// Request message for `MembershipService.SuspendMembership`.
message SuspendMembershipRequest {
  // Required. The name of the card.
  //
  // (-- api-linter: core::0124::reference-same-package=disabled
  //     aip.dev/not-precedent: The owner API and the operations API share the
  //     Membership resource. --)
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Membership"
  ];

  // Required. Why the operator suspends the card. The audit event stores it.
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for `MembershipService.ResumeMembership`.
message ResumeMembershipRequest {
  // Required. The name of the card.
  //
  // (-- api-linter: core::0124::reference-same-package=disabled
  //     aip.dev/not-precedent: The owner API and the operations API share the
  //     Membership resource. --)
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Membership"
  ];

  // Required. Why the operator resumes the card. The audit event stores it.
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for `MembershipService.GetEntitlementGrant`.
message GetEntitlementGrantRequest {
  // Required. The name of the grant.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/EntitlementGrant"
  ];
}

// Request message for `MembershipService.ListEntitlementGrants`.
message ListEntitlementGrantsRequest {
  // Required. The card, for example `users/-/memberships/m1`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "boji.leanmuscle.club/EntitlementGrant"
  ];

  // Optional. The maximum number of grants to return. Zero means the default
  // of 50. Values above 100 are treated as 100. Negative values return
  // `INVALID_ARGUMENT`.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The `next_page_token` of a previous call with the same
  // `parent`. Empty for the first page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `MembershipService.ListEntitlementGrants`.
message ListEntitlementGrantsResponse {
  // The grants on this page.
  repeated EntitlementGrant entitlement_grants = 1;

  // A token for the next page. Empty when no further page exists.
  string next_page_token = 2;
}

// Request message for `MembershipService.GrantEntitlement`.
message GrantEntitlementRequest {
  // Required. The card, for example `users/-/memberships/m1`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "boji.leanmuscle.club/EntitlementGrant"
  ];

  // Required. The catalog entry to grant, for example `entitlements/e1`.
  string entitlement = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Entitlement"
  ];

  // Optional. The expiry of the grant. It must be later than the server
  // time. Absent means no expiry. The server stores microsecond precision
  // and drops the remaining nanoseconds.
  google.protobuf.Timestamp expire_time = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. Why the operator grants the entitlement. The audit event
  // stores it.
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
}

// Response message for `MembershipService.GrantEntitlement`.
message GrantEntitlementResponse {
  // The grant after the call.
  EntitlementGrant entitlement_grant = 1;
}

// Request message for `MembershipService.RevokeEntitlementGrant`.
message RevokeEntitlementGrantRequest {
  // Required. The name of the grant.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/EntitlementGrant"
  ];

  // Required. Why the operator revokes the grant. The audit event stores it.
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

// The fields that a method returns for a `boji.v1.Membership` (AIP-157).
enum MembershipView {
  // The default view of the method. Each method documents its default.
  MEMBERSHIP_VIEW_UNSPECIFIED = 0;

  // Every field except `entitlements`.
  MEMBERSHIP_VIEW_BASIC = 1;

  // Every field.
  MEMBERSHIP_VIEW_FULL = 2;
}
