syntax = "proto3";

package boji.admin.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "EntitlementServiceProto";
option java_package = "club.leanmuscle.boji.admin.v1";

// Reads the server-owned entitlement catalog.
//
// The operations API shares its authorization rules across services. Every
// method requires a signed Bearer session for a verified email address, and
// the session must be created within the last 15 minutes. The Better Auth
// role of the caller must grant the permission that the method names. The
// server checks the session and the permission first, and then the email
// address and the session age. It reads no input before these checks, so a
// caller without permission learns nothing about the targets. Banned
// accounts and impersonation sessions are denied.
//
// Authorization errors:
// - `UNAUTHENTICATED` `SESSION_REQUIRED`: the session is missing, invalid or
//   revoked.
// - `PERMISSION_DENIED` `ADMIN_FORBIDDEN`: the role does not grant the
//   permission, the account is banned, or the session is an impersonation
//   session.
// - `PERMISSION_DENIED` `EMAIL_NOT_VERIFIED`: the email address is not
//   verified.
// - `PERMISSION_DENIED` `FRESH_SESSION_REQUIRED`: the session is older than
//   15 minutes.
service EntitlementService {
  option (google.api.default_host) = "boji.leanmuscle.club";

  // Returns one catalog entry. Permission: `entitlement.read`.
  //
  // Errors: `NOT_FOUND` `ENTITLEMENT_NOT_FOUND`.
  rpc GetEntitlement(GetEntitlementRequest) returns (Entitlement) {
    option (google.api.http) = {get: "/v1/{name=entitlements/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists every catalog entry, including inactive entries, ordered by `code`
  // ascending. Permission: `entitlement.read`.
  rpc ListEntitlements(ListEntitlementsRequest) returns (ListEntitlementsResponse) {
    option (google.api.http) = {get: "/v1/entitlements"};
  }
}

// One entry of the entitlement catalog. Database migrations own the catalog.
// This API does not create, change or delete entries.
message Entitlement {
  option (google.api.resource) = {
    type: "boji.leanmuscle.club/Entitlement"
    pattern: "entitlements/{entitlement}"
    singular: "entitlement"
    plural: "entitlements"
  };

  // The availability of a catalog entry. New states can be added.
  enum State {
    // Never sent.
    STATE_UNSPECIFIED = 0;

    // The entry accepts grants, and its grants can be effective.
    ACTIVE = 1;

    // The entry accepts no new grant, and none of its grants is effective.
    // Existing grants can still be revoked.
    INACTIVE = 2;
  }

  // Identifier. The resource name, for example `entitlements/e1`. The
  // `{entitlement}` segment is a server-assigned UUID.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The stable machine-readable code, for example
  // `local_tracking`. `boji.v1.Membership.EffectiveEntitlement.code` carries
  // the same value.
  string code = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The human-readable name.
  string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The description.
  string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The availability of the entry.
  State state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the entry was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time of the last change of the entry.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for `EntitlementService.GetEntitlement`.
message GetEntitlementRequest {
  // Required. The name of the entry, for example `entitlements/e1`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "boji.leanmuscle.club/Entitlement"
  ];
}

// Request message for `EntitlementService.ListEntitlements`.
message ListEntitlementsRequest {
  // Optional. The maximum number of entries to return. Zero means the
  // default of 50. Values above 100 are treated as 100. Negative values
  // return `INVALID_ARGUMENT`.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The `next_page_token` of a previous call. Empty for the first
  // page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `EntitlementService.ListEntitlements`.
message ListEntitlementsResponse {
  // The catalog entries, ordered by `code` ascending.
  repeated Entitlement entitlements = 1;

  // A token for the next page. Empty when no further page exists.
  string next_page_token = 2;
}
