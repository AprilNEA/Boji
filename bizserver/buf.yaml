# buf workspace of the Boji API contract.
#
# The only module is proto/. buf.lock pins the googleapis dependency.
# build.rs and ios/BojiAPI/buf.gen.yaml both read this workspace.
version: v2
modules:
  - path: proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # ErrorReason follows google.api.ErrorReason: its value names are the
    # wire values of google.rpc.ErrorInfo.reason, so they carry no prefix.
    - ENUM_VALUE_PREFIX
    # AIP-131, AIP-133 and AIP-216 return the resource itself, so several
    # methods share one response type that is not named after the method.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
