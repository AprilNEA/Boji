article_first_workout_title: "第一次训练，不必用力过猛"
article_first_workout_category: "训练起步"
article_first_workout_s1_title: "从能完成的量开始"
article_first_workout_s1_body: "第一次的目标不是练到筋疲力尽，而是熟悉动作。选择轻负荷，保持呼吸。做不完时可以减少次数。"
article_first_workout_s2_title: "给恢复留出位置"
article_first_workout_s2_body: "把力量训练分散到不同的日子。明显疲劳时休息，不用为了打卡补练。"
article_first_workout_s3_title: "不舒服就停下"
article_first_workout_s3_body: "肌肉用力和疼痛并不相同。出现锐痛、头晕或胸部不适时立即停止，并按情况寻求专业帮助。"
article_eat_well_title: "好好吃饭，比完美食谱重要"
article_eat_well_category: "饮食日常"
article_eat_well_s1_title: "先吃得规律"
article_eat_well_s1_body: "从规律吃饭开始，不用靠挨饿换取线条。为自己留出完整的一餐，比追求一份完美食谱更可持续。"
article_eat_well_s2_title: "让餐盘丰富一点"
article_eat_well_s2_body: "主食、蔬菜和蛋白质食物都可以出现在餐盘里。根据口味和条件选择，不必购买特定补剂。"
article_eat_well_s3_title: "不把食物分成好坏"
article_eat_well_s3_body: "偶尔的聚餐不会抹去你的努力。吃完不需要惩罚式运动。有疾病或特殊营养需求时，咨询专业人员。"
article_rest_well_title: "休息，不是计划之外的事"
article_rest_well_category: "恢复习惯"
article_rest_well_s1_title: "留一个放松的夜晚"
article_rest_well_s1_body: "尝试稳定的作息，睡前给自己一段不被工作打扰的时间。记录睡眠是为了了解自己，而不是完成分数。"
article_rest_well_s2_title: "今天不练，也可以"
article_rest_well_s2_body: "疲劳时可以休息，或选择舒适的轻活动。休息不会让你失去俱乐部的入场券。"
article_rest_well_s3_title: "持续不适时求助"
article_rest_well_s3_body: "如果睡眠或疲劳问题持续影响生活，寻求专业帮助。App 中的记录不是医学诊断。"
