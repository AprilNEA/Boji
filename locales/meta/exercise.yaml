exercise_reps_count:
  comment: 每组的次数，例如「8 次」
  args:
    count: int
exercise_reps_count_range:
  comment: 每组次数的范围，例如「8～10 次」
  args:
    min: int
    max: int
exercise_reps_count_per_side:
  comment: 左右两侧各做的次数，例如「每侧 8 次」
  args:
    count: int
exercise_reps_seconds:
  comment: 每组保持的秒数，例如「20 秒」
  args:
    seconds: int
exercise_reps_seconds_range:
  comment: 每组保持秒数的范围，例如「20～30 秒」
  args:
    min: int
    max: int
exercise_reps_seconds_per_side:
  comment: 左右两侧各保持的秒数，例如「每侧 20 秒」
  args:
    seconds: int
