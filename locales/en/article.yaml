article_first_workout_title: "First Workout? No Need to Go All Out"
article_first_workout_category: "Getting Started"
article_first_workout_s1_title: "Start with what you can finish"
article_first_workout_s1_body: "The goal of your first session is to learn the moves, not to wear yourself out. Choose a light load and keep breathing. If you can’t finish, do fewer reps."
article_first_workout_s2_title: "Make room for recovery"
article_first_workout_s2_body: "Spread strength training across different days. Rest when you feel clearly tired. You don’t need to make up a session just to keep a check-in."
article_first_workout_s3_title: "Stop if it doesn’t feel right"
article_first_workout_s3_body: "Muscle effort is not the same as pain. Stop at once if you feel sharp pain, dizziness or chest discomfort, and get professional help when needed."
article_eat_well_title: "Eating Well Beats a Perfect Meal Plan"
article_eat_well_category: "Everyday Eating"
article_eat_well_s1_title: "Eat regularly first"
article_eat_well_s1_body: "Start with regular meals. You don’t need to go hungry to get toned. Giving yourself a full meal lasts longer than chasing a perfect meal plan."
article_eat_well_s2_title: "Add some variety to your plate"
article_eat_well_s2_body: "Grains, vegetables and protein foods all belong on your plate. Choose by taste and what you have. You don’t need special supplements."
article_eat_well_s3_title: "Food isn’t good or bad"
article_eat_well_s3_body: "An occasional meal out won’t erase your effort. You don’t need to exercise as punishment after eating. If you have a medical condition or special nutritional needs, talk to a professional."
article_rest_well_title: "Rest Is Part of the Plan"
article_rest_well_category: "Recovery Habits"
article_rest_well_s1_title: "Keep an evening to unwind"
article_rest_well_s1_body: "Try a steady routine, and give yourself some time before bed without work. Tracking sleep helps you understand yourself. It isn’t a score to hit."
article_rest_well_s2_title: "It’s OK to skip today"
article_rest_well_s2_body: "When you’re tired, rest or choose some easy, comfortable activity. Resting won’t cost you your place in the club."
article_rest_well_s3_title: "Ask for help if it doesn’t go away"
article_rest_well_s3_body: "If sleep or fatigue problems keep affecting your life, get professional help. The records in this app are not a medical diagnosis."
