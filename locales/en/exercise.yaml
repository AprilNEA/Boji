exercise_bodyweight_squat_name: "Bodyweight Squat"
exercise_bodyweight_squat_tip: "Point your knees toward your toes and rise slowly."
exercise_wall_push_up_name: "Wall Push-Up"
exercise_wall_push_up_tip: "Keep your body in a straight line and your hands steady on the wall."
exercise_glute_bridge_name: "Glute Bridge"
exercise_glute_bridge_tip: "Plant your feet and don’t shrug as you lift."
exercise_bird_dog_name: "Bird Dog"
exercise_bird_dog_tip: "Move slowly and keep your torso stable."
exercise_reverse_lunge_name: "Reverse Lunge"
exercise_reverse_lunge_tip: "Step back, then lower. Keep your front knee in line with your toes."
exercise_knee_push_up_name: "Knee Push-Up"
exercise_knee_push_up_tip: "Keep a straight line from knees to head and lower your chest slowly."
exercise_dead_bug_name: "Dead Bug"
exercise_dead_bug_tip: "Keep your lower back on the floor and slowly extend the opposite arm and leg."
exercise_wall_sit_name: "Wall Sit"
exercise_wall_sit_tip: "Keep your back on the wall and your thighs parallel to the floor."
exercise_plank_name: "Plank"
exercise_plank_tip: "Keep your elbows under your shoulders and your body in one straight line."
exercise_chest_press_name: "Seated Chest Press"
exercise_chest_press_tip: "Choose a light weight and keep your back against the pad."
exercise_seated_row_name: "Seated Row"
exercise_seated_row_tip: "Keep your shoulders relaxed as you pull toward your body."
exercise_leg_press_name: "Seated Leg Press"
exercise_leg_press_tip: "Use a weight you can control and don’t lock your knees."
exercise_lat_pulldown_name: "Lat Pulldown"
exercise_lat_pulldown_tip: "Pull the bar down gently and don’t lean back."
exercise_cat_cow_name: "Cat-Cow"
exercise_cat_cow_tip: "Move with your breath and keep it gentle."
exercise_hip_flexor_stretch_name: "Hip Flexor Stretch"
exercise_hip_flexor_stretch_tip: "Keep your pelvis steady and don’t bounce."
exercise_chest_stretch_name: "Chest Opener"
exercise_chest_stretch_tip: "Gently open your chest and let your shoulders drop."
exercise_push_up_name: "Push-Up"
exercise_push_up_tip: "Keep your body in a straight line and lower your chest close to the floor."
exercise_bodyweight_split_squat_name: "Split Squat"
exercise_bodyweight_split_squat_tip: "Keep your stance fixed, lower straight down and drive up through your front heel."
exercise_single_leg_glute_bridge_name: "Single-Leg Glute Bridge"
exercise_single_leg_glute_bridge_tip: "Hold one knee toward your chest and push your hips up through the other heel."
exercise_bench_dip_name: "Bench Dip"
exercise_bench_dip_tip: "Grip the edge of a sturdy chair or bench behind you and bend your elbows to about 90 degrees."
exercise_superman_name: "Superman"
exercise_superman_tip: "Lift your arms and legs together and keep your neck relaxed."
exercise_bodyweight_forearm_side_plank_name: "Side Plank"
exercise_bodyweight_forearm_side_plank_tip: "Keep your elbow under your shoulder and don’t let your hips sag."
exercise_crunch_name: "Crunch"
exercise_crunch_tip: "Lift your upper back with your abs and keep your lower back on the mat."
exercise_reverse_crunch_name: "Reverse Crunch"
exercise_reverse_crunch_tip: "Curl your pelvis to bring your knees toward your chest, then lower slowly."
exercise_bicycle_crunch_name: "Bicycle Crunch"
exercise_bicycle_crunch_tip: "Turn your elbow toward the opposite knee, and don’t pull on your neck."
exercise_russian_twist_name: "Russian Twist"
exercise_russian_twist_tip: "Lift your feet, keep your back straight and turn your rib cage side to side."
exercise_flutter_kick_name: "Flutter Kick"
exercise_flutter_kick_tip: "Press your lower back into the mat and make small, alternating kicks with straight legs."
exercise_jumping_jack_name: "Jumping Jack"
exercise_jumping_jack_tip: "Land with soft knees and bring your arms together overhead."
exercise_wall_high_knees_name: "Wall High Knees"
exercise_wall_high_knees_tip: "Keep your hands on the wall and drive each knee toward your chest in turn."
exercise_mountain_climber_name: "Mountain Climber"
exercise_mountain_climber_tip: "Keep your hands under your shoulders and drive your knees toward your chest in turn."
exercise_jump_squat_name: "Jump Squat"
exercise_jump_squat_tip: "Cross your arms over your chest and land softly back into the squat."
exercise_bear_crawl_name: "Bear Crawl"
exercise_bear_crawl_tip: "Hover your knees just off the floor and move your opposite hand and foot together."
exercise_bodyweight_burpee_name: "Burpee"
exercise_bodyweight_burpee_tip: "Move at your own pace and land with soft knees."
exercise_dumbbell_goblet_squat_name: "Goblet Squat"
exercise_dumbbell_goblet_squat_tip: "Hold the dumbbell close to your chest and keep your back straight as you squat."
exercise_dumbbell_floor_press_name: "Dumbbell Floor Press"
exercise_dumbbell_floor_press_tip: "Let your upper arms touch the floor lightly, then press up."
exercise_dumbbell_bent_over_row_name: "Dumbbell Bent-Over Row"
exercise_dumbbell_bent_over_row_tip: "Keep your back flat and your elbows close as you pull the dumbbells toward your waist."
exercise_dumbbell_romanian_deadlift_name: "Dumbbell Romanian Deadlift"
exercise_dumbbell_romanian_deadlift_tip: "Push your hips back and keep the dumbbells close to your legs."
exercise_dumbbell_reverse_lunge_name: "Dumbbell Reverse Lunge"
exercise_dumbbell_reverse_lunge_tip: "Step back, then lower, keeping your torso upright."
exercise_dumbbell_lateral_raise_name: "Dumbbell Lateral Raise"
exercise_dumbbell_lateral_raise_tip: "Keep a slight bend in your elbows and raise only to shoulder height."
exercise_dumbbell_bench_press_name: "Dumbbell Bench Press"
exercise_dumbbell_bench_press_tip: "Plant your feet, bend your elbows to about 90 degrees, then press up."
exercise_dumbbell_seated_shoulder_press_name: "Seated Dumbbell Shoulder Press"
exercise_dumbbell_seated_shoulder_press_tip: "Keep your back against the bench and don’t shrug as you press."
exercise_dumbbell_biceps_curl_name: "Dumbbell Biceps Curl"
exercise_dumbbell_biceps_curl_tip: "Keep your upper arms by your sides and don’t swing."
exercise_machine_chest_press_name: "Machine Chest Press"
exercise_machine_chest_press_tip: "Keep your back against the pad and press until your elbows are almost straight."
exercise_machine_shoulder_press_name: "Machine Shoulder Press"
exercise_machine_shoulder_press_tip: "Keep your back against the backrest and press up smoothly."
exercise_machine_assisted_pull_up_name: "Assisted Pull-Up"
exercise_machine_assisted_pull_up_tip: "Pull until your chin clears the handles, then lower slowly without swinging."
exercise_machine_pec_deck_fly_name: "Pec Deck Fly"
exercise_machine_pec_deck_fly_tip: "Keep a slight bend in your elbows, bring the handles together, then open slowly."
exercise_cable_face_pull_name: "Cable Face Pull"
exercise_cable_face_pull_tip: "Pull the rope toward your face and spread your hands, keeping your upper arms level."
exercise_cable_rope_triceps_pushdown_name: "Rope Triceps Pushdown"
exercise_cable_rope_triceps_pushdown_tip: "Keep your upper arms at your sides and move only your forearms."
exercise_machine_leg_extension_name: "Leg Extension"
exercise_machine_leg_extension_tip: "Line up your knees with the machine’s pivot, pause at the top and lower slowly."
exercise_machine_seated_leg_curl_name: "Seated Leg Curl"
exercise_machine_seated_leg_curl_tip: "Keep your thighs under the pad and curl your lower legs under the seat."
exercise_machine_seated_hip_abduction_name: "Seated Hip Abduction"
exercise_machine_seated_hip_abduction_tip: "Keep your back against the pad, push your knees apart and pause."
exercise_machine_seated_hip_adduction_name: "Seated Hip Adduction"
exercise_machine_seated_hip_adduction_tip: "Squeeze your knees together, then return slowly."
exercise_back_extension_name: "Back Extension"
exercise_back_extension_tip: "Rise until your body lines up with your legs, and don’t arch past it."
exercise_standing_hamstring_stretch_name: "Standing Hamstring Stretch"
exercise_standing_hamstring_stretch_tip: "Keep your front leg straight and your back flat as you lean forward from your hips."
exercise_prone_quadriceps_stretch_name: "Prone Quad Stretch"
exercise_prone_quadriceps_stretch_tip: "Hold your ankle and draw your heel toward your glutes, keeping your hips down."
exercise_supine_figure_four_glute_stretch_name: "Figure-Four Glute Stretch"
exercise_supine_figure_four_glute_stretch_tip: "Cross one ankle over the other knee and draw your legs toward your chest."
exercise_runners_lunge_stretch_name: "Runner’s Lunge Stretch"
exercise_runners_lunge_stretch_tip: "Plant your hands beside your front foot and shift your hips back to stretch the back of your front leg."
exercise_wall_standing_calf_stretch_name: "Wall Calf Stretch"
exercise_wall_standing_calf_stretch_tip: "Keep your back leg straight and your heel down as you lean toward the wall."
exercise_neck_side_stretch_name: "Neck Side Stretch"
exercise_neck_side_stretch_tip: "Tilt your ear slowly toward your shoulder and keep your shoulders relaxed."
exercise_cross_body_shoulder_stretch_name: "Cross-Body Shoulder Stretch"
exercise_cross_body_shoulder_stretch_tip: "Bring one arm across your chest, support the elbow with the other hand and keep your shoulder down."
exercise_overhead_triceps_stretch_name: "Overhead Triceps Stretch"
exercise_overhead_triceps_stretch_tip: "Reach one hand behind your head and gently pull that elbow with the other hand."
exercise_chair_seated_chest_and_shoulder_stretch_name: "Seated Chest Opener"
exercise_chair_seated_chest_and_shoulder_stretch_tip: "Sit at the front of the chair, hold the chair back behind you and lift your chest forward."
exercise_seated_chair_hamstring_stretch_name: "Seated Hamstring Stretch"
exercise_seated_chair_hamstring_stretch_tip: "Sit at the front of the chair, straighten one leg with the heel down and lean forward from your hips."
exercise_worlds_greatest_stretch_name: "World’s Greatest Stretch"
exercise_worlds_greatest_stretch_tip: "From a lunge, bring your elbow toward the inside of your front foot, then straighten your front leg."
exercise_inchworm_name: "Inchworm"
exercise_inchworm_tip: "Keep your hands planted and your legs straight, walk your feet toward your hands, then return to a plank."
exercise_bodyweight_good_morning_name: "Bodyweight Good Morning"
exercise_bodyweight_good_morning_tip: "Soften your knees, push your hips back and keep your back flat."
exercise_knees_to_chest_stretch_name: "Knees-to-Chest Stretch"
exercise_knees_to_chest_stretch_tip: "Hold your shins and draw your knees toward your chest, letting your lower back rest on the floor."
exercise_childs_pose_name: "Child’s Pose"
exercise_childs_pose_tip: "Keep your hands in place and sit your hips back onto your heels."
