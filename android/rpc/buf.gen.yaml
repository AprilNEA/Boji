# Kotlin code generation for the Boji member API (boji.v1) and the staff
# membership-code check (boji.admin.v1.MembershipCodeService). Run
# `buf generate` in this directory and commit the output. The input is the buf
# workspace in bizserver/, the owner of the API contract. build.gradle.kts
# compiles generated/ as source; the Android build does not run protoc or buf.
version: v2
clean: true
plugins:
  # Lite messages. Keep the version equal to `protobuf` in
  # ../gradle/libs.versions.toml: plugin v36.2 matches runtime 4.36.2.
  - remote: buf.build/protocolbuffers/java:v36.2
    out: generated/java
    opt:
      - lite
  # Kotlin DSL builders such as `membership { ... }`, on the same runtime.
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: generated/kotlin
    opt:
      - lite
  # Connect clients with suspend functions, the plugin default. Keep the
  # version equal to `connectKotlin` in ../gradle/libs.versions.toml.
  - remote: buf.build/connectrpc/kotlin:v0.9.0
    out: generated/kotlin
inputs:
  # The member API, and the one boji.admin.v1 service that the apps call:
  # staff scan membership codes in the app. Do not add other boji.admin.v1
  # files. buf resolves `paths` of a directory input against this directory.
  - directory: ../../bizserver
    paths:
      - ../../bizserver/proto/boji/v1
      - ../../bizserver/proto/boji/admin/v1/membership_code_service.proto
  # The googleapis types that boji.v1 messages and error details use. Keep
  # the commit equal to the googleapis commit in bizserver/buf.lock.
  - module: buf.build/googleapis/googleapis:8ac61b9e502343289c8c42b17aa5b245
    paths:
      - google/rpc/code.proto
      - google/rpc/error_details.proto
      - google/rpc/status.proto
      - google/type/date.proto
      - google/type/localized_text.proto
